name: Publish the scheduled carousel

# Runs on GitHub's servers, so nothing has to be open on anyone's machine.
# publish.py decides whether anything is actually due, so firing often is free:
# every run but one prints "nothing due" and stops.
#
# Every two hours rather than once a day, because GitHub's scheduler is
# best-effort and has been running this up to five hours behind the requested
# time. Once a day, that delay lands the post at midnight Israel time; every two
# hours, the first run after a post comes due picks it up.
on:
  schedule:
    - cron: "35 */2 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Force one post number, e.g. 4. Leave empty to publish whatever is due."
        required: false

permissions:
  contents: write               # so the run can commit published.json back

concurrency:
  group: instagram-publish      # never two runs posting at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # kept out of the command line: an input must never be interpolated into `run`
          FORCE_POST: ${{ github.event.inputs.post }}
        run: |
          case "$FORCE_POST" in
            ""|[0-9]|[0-9][0-9]) ;;
            *) echo "post must be a number"; exit 1 ;;
          esac
          python3 publish.py $FORCE_POST

      - name: Record what went out
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "two-otters-bot"
            git config user.email "noreply@github.com"
            git add published.json
            git commit -m "Published $(date -u +%F)"
            git push
          fi

      # The Instagram token lasts 60 days and refreshing it resets the clock.
      # Storing the new one needs a token that may write secrets, so this step is
      # skipped when GH_PAT is not set and the run just says so.
      #
      # continue-on-error, because a failed refresh is a warning, not a failed
      # post. Without it a healthy run that published nothing still goes red and
      # hides whether the posting itself worked.
      - name: Keep the token alive
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 publish.py --refresh
          if [ -z "$GH_TOKEN" ]; then
            echo "No GH_PAT secret, so the refreshed token cannot be stored."
            echo "Replace IG_TOKEN by hand before the days above run out."
          else
            gh secret set IG_TOKEN < .new_token && echo "IG_TOKEN updated."
          fi
          rm -f .new_token
