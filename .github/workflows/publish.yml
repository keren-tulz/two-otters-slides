name: Publish the scheduled carousel

# Runs on GitHub's servers, so nothing has to be open on anyone's machine.
# publish.py decides whether anything is actually due, so firing often is free:
# every run but one prints "nothing due" and stops in a few seconds.
#
# GitHub's scheduler is best effort and drops a lot: asking for a run every two
# hours actually produced one every 6.7 hours on average, and once went 24 hours
# between runs. A post timed for the evening could land the following morning.
#
# So the attempts are concentrated where they matter. Every 15 minutes through
# the posting window on Sundays and Wednesdays gives twenty chances to catch a
# 17:00 slot, which survives even that drop rate. The four-hourly line is the
# safety net that picks up anything the window still missed.
on:
  schedule:
    - cron: "*/15 16-20 * * 0,3"
    - cron: "25 */4 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Force one post number, e.g. 4. Leave empty to publish whatever is due."
        required: false

permissions:
  contents: write               # so the run can commit published.json back

concurrency:
  group: instagram-publish      # never two runs posting at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # optional: with it, captions are read from ClickUp at publish time
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          # kept out of the command line: an input must never be interpolated into `run`
          FORCE_POST: ${{ github.event.inputs.post }}
        run: |
          case "$FORCE_POST" in
            ""|[0-9]|[0-9][0-9]) ;;
            *) echo "post must be a number"; exit 1 ;;
          esac
          python3 publish.py $FORCE_POST

      - name: Record what went out
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "two-otters-bot"
            git config user.email "noreply@github.com"
            git add published.json
            git commit -m "Published $(date -u +%F)"
            git push
          fi

      # A page token derived from a long-lived user token has no expiry, so there
      # is nothing to renew. This only says so out loud, and warns early if the
      # stored token turns out to be the kind that does lapse.
      #
      # continue-on-error, because this is a report. Without it a healthy run
      # that published nothing could still go red and hide whether posting worked.
      - name: Report on the token
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 publish.py --status
