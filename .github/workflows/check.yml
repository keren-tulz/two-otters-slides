name: Check the connection

# A dry run. It proves the token works and that Meta can fetch every slide of the
# next post, then stops before publishing. Nothing appears on the profile.
on:
  workflow_dispatch:
    inputs:
      reel:
        description: "Stage one reel by id, e.g. studio-1. Leave empty for the next reel."
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the next post without publishing it
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python3 publish.py --check
      - name: Upload the next reel without publishing it
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # kept out of the command line: an input must never be interpolated into `run`
          REEL: ${{ github.event.inputs.reel }}
        run: |
          case "$REEL" in
            ""|tip-[A-T]|remake-[0-9][0-9]|studio-[1-9]) ;;
            *) echo "not a reel id"; exit 1 ;;
          esac
          python3 reels.py --check $REEL
